# Pre-registered control PC21 (DESIGN v3.1 2.7). Drafted at FZ-R; only the fields listed in `pending`
# may change before the first run (filled at FZ-C / FZ-X; check with part2.registry.fill_only_changes).
id: CTRL_PC21
direction: controls
hypothesis: |
  Haematopoietic lines are more dependent than breast lines on the CDK6/CCND3 sub-module relative to its sibling
  complement (which contains CDK4/CCND1), and on CDK6 relative to CDK4 and CCND3 relative to CCND1 (gene
  contrasts).
sign: "+"
context_family:
  name: "PC21 context"
  contexts:
    - id: heme_vs_breast
      definition: "1 = Myeloid/Lymphoid, 0 = Breast, others NaN (PC21)"
      reference: "Breast lineage"
      n_A: 106
      ref_A: 50
      n_L: 35
      ref_L: 17
      size_class_A: confirmatory
      lockbox_testable: true
control:
  design_id: PC21
  level: "C (sub-module contrast) + G contrasts"
  design_sign: "+"
  sign_mapping: "Same as DESIGN. '+' = more dependent (lower gene effect) in context = 1 than in the reference; alternative = less"
  gene_contrasts: ["CDK6 - CDK4", "CCND3 - CCND1"]
  gene_units:
    - "CDK6 (1021) minus CDK4 (1019)"
    - "CCND3 (896) minus CCND1 (595)"
  complex_unit: "not evaluable at complex level"
  complex_unit_rule: "frozen sub-module containing CDK6 (else CCND3); evaluable at complex level only if CDK6 (or CCND3) and CDK4 (or CCND1) fall in different frozen sub-modules of the same frozen coarse complex; otherwise 'not evaluable at complex level'"
  readout_C: "submodule_vs_sibling: sub-module score (mean of members, winsor +/-3) residualised on its sibling complement (parent minus sub-module) by OLS across A models; the A-fitted coefficients are applied unchanged in L"
  removed_members: "none (lineage context)"
complex_set_hash: d01b548efb478ce6
score: submodule_vs_sibling
covariates: [library, ScreenType3DO, ModelType, NNMD, CasActivity]
covariate_rule: "lineage_FE excluded: the context is a lineage contrast; NNMD and CasActivity are the H2 primary covariates (complete-case: CasActivity is missing in 119 of 1,007 A models)"
statistic: >
  HC3 OLS t with Satterthwaite df, one test per unit (gene units and the complex unit), one-sided at
  alpha = 0.05 in A (alternative = less for '+', greater for '-'); complete-case per test, n reported.
  No multiplicity correction: fixed denominator of 23 control entries (DESIGN 2.7).
fdr_family:
  method: none
  q: 0.05
family_m:
  formula: "number of gene units + 1 if the complex unit is evaluable (one one-sided test each)"
  value: 2
kill_rule:
  direction: H2
  counted: true
  level: C
  recovered_if: "complex-level readout has the expected sign with one-sided HC3 p < 0.05 in A"
  evaluable_if: "the complex unit exists (complex_unit filled with a frozen unit ID) and the context has >= 12 A models after complete-case"
  rule: "the mapped direction is dropped (and reported) if < 50% of its evaluable complex-level controls are recovered (DESIGN 2.6)"
lockbox:
  testable: true
  n_L: 35
  confirmation_rule: >
    Reported, not part of the kill rule. Same sign and one-sided p < 0.05 in L at the same level and
    readout (HC3, Satterthwaite df; exact PatientID-blocked Freedman-Lane permutation unrestricted
    across lineages (lineage context), 10,000 permutations, when fewer than 20 context models are in L).
    Requires >= 5 context and >= 5 reference models in L.
  rare_route: >
    If not lockbox-testable: leave-one-lineage-out (LOSO) same sign, DEMETER2 on A models same sign,
    and leave-one-model-out same sign; labelled 'not lockbox-testable'.
  target_list: results/part2/lockbox_targets/CTRL_PC21.json
multiverse:
  scores: [eigengene, within_line_rank, expression_masked, pan_essential_referenced]
  covariate_sensitivity: [NNMD, doubling_time, CasActivity, GrowthPattern]
  robustness: [leave-one-OncotreePrimaryDisease-out same sign p < 0.05, leave-top-2-out same sign p < 0.05, breadth]
  use: "reported per control; never selected; the kill rule uses the primary readout only"
seeds:
  permutation: 4421
  lockbox_permutation: 6721
success_criterion: "recovered: expected sign with one-sided HC3 p < 0.05 in A at the complex level; lockbox confirmation reported separately"
stopping_rule: >
  Runs once, in the single controls script after FZ-C and FZ-X, together with every other control
  entry; no re-run and no change of readout, covariates or context after results are seen. The kill-rule
  tally uses A results only and is committed before any direction's discovery run. Then one lockbox read
  (crispr) for this entry, after which status is set to closed.
frozen_inputs:
  - results/part2/contexts/checksums.json
  - results/part2/lockbox/manifest.json
  - results/part2/construction/FZC_manifest.json   # FZ-C manifest: complex map, sub-modules, tiers, member/attachment rules
  - results/part2/fzx/FZX_manifest.json   # FZ-X manifest: context table freeze, family enumeration, lockbox-testable list
amendments:
  - id: A3
    timestamp_utc: 2026-10-29T02:03:27Z
    amends_commit: 21fe1be1cdfe9d9b5b68c02c1b5a46b2b5b66a69
    reason: >
      PI ruling A3(a) on the lockbox dry check (results/part2/lockbox_confirm/BLOCKED.md), before any lockbox read; no
      L values read. The lockbox confirmation permutation seed was not registered: lockbox_permutation is the seed of
      the exact PatientID-blocked Freedman-Lane permutation in L (confirm.confirm_entry: seed + hit index, hits in
      (context, unit) order). H3a 6100, H3b 6200, H1 6300, H1S 6400, H2 6500, BRIDGE-L 6600, CTRL 6700 + registry
      index; checked against every registered or documented seed, no collision. Record: docs/registry/AMENDMENTS.md.
    changed_paths: [seeds.lockbox_permutation]
status: open
