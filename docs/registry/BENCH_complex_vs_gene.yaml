# Complex-vs-gene benchmark (DESIGN v3.1 2.5). Runs only after every controls/H3a/H3b/H1/H2 entry has its
# lockbox ledger line (enforced by part2.assoc.read_lockbox). Only `pending` fields may change before the run.
id: BENCH_complex_vs_gene
direction: benchmark
hypothesis: >
  For context associations discovered in A, the complex score replicates in the lockbox better than the single
  best member chosen in A, and the advantage grows with the breadth of the association across members.
