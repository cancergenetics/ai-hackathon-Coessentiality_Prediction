complex_set_hash: 53f9dbf46370d237
units: >
  Frozen coarse complexes of the zavg_BEF map (same set as H3a/H3b). Primary pair set: every (complex C, context
  c) discovered in H3a or H3b (q < 0.05 after permutation re-entry) with c lockbox-testable. Secondary: all
  evaluable (C, c) pairs of those contexts.
score: S_C_mean_winsor3
estimand: |
  Delta(C, c) = z_L(S_C) - z_L(g*), where z_L is the HC3 t of the context coefficient in L (same covariates and
     removals as discovery), signed so that positive = effect in the A direction of the complex association.
  g* = the member of C (after the same removals) with the largest |t| in A in the complex's A direction (ties:
     larger |beta|), chosen in A only.
  Breadth(C, c) = fraction of C's members with one-sided p < 0.05 in A in that direction; terciles fixed on the
     primary pairs' A breadth.
  Summary: mean Delta overall and per breadth tercile, 95% CI by PatientID-blocked bootstrap over L models (B =
     2000, seed 5100; pairs and g* fixed, t recomputed per resample).
  Secondary: A-L correlation of context effects (residual-SD units) for complexes vs random gene sets matched on
     size, essentiality and coherence (seed 7100); number of distinct complexes among the g*.
covariates: [lineage_FE, library, ScreenType3DO, ModelType]
covariate_rule: >
  As in the H3a / H3b entry of each context (per-context lists above).
fdr_family:
  method: none
  q: 0.05
family_m:
  formula: "number of primary (C, c) pairs = H3a + H3b discoveries in lockbox-testable contexts (estimation, no test family)"
  value: "set by the committed H3a and H3b discovery runs (estimation, no test family)"
lockbox:
  target_list: results/part2/lockbox_targets/BENCH_complex_vs_gene.json
  rule: >
    One read (crispr) of all members of the complexes in the primary and secondary pair sets, only after every
    controls/H3a/H3b/H1/H2 entry has a ledger line.
multiverse:
  scores: [eigengene, within_line_rank]
  other: [g* chosen by largest |beta| instead of |t|, pair set restricted to T1/T2 complexes]
  use: "reported, never selected"
  not_run: [within_line_rank]
  not_run_reason: "needs genome-wide within-line ranks in L; the registered BENCH read covers complex members only (amendment A3(b), PI ruling: the read is not widened; reported as a limitation)"
  ci: point estimate only
seeds:
  bootstrap: 5100
  matched_sets: 7100
run_after: [every controls/H3a/H3b/H1/H2 entry closed with its lockbox ledger line]
success_criterion: >
  The complex wins where breadth is high: mean Delta > 0 with the 95% bootstrap CI excluding 0 in the top
  breadth tercile (primary); trend Spearman(Delta, breadth) > 0 reported. If the top-tercile CI includes 0, the
  paper states that complex scores did not out-replicate the best gene.
stopping_rule: >
  One computation after all confirmations close; one lockbox read; then closed. No re-definition of g*, breadth
  or pair set after the read.
frozen_inputs:
  - results/part2/contexts/checksums.json
  - results/part2/lockbox/manifest.json
  - results/part2/construction/FZC_manifest.json   # FZ-C manifest: complex map, sub-modules, tiers, member/attachment rules
  - results/part2/fzx/FZX_manifest.json   # FZ-X manifest: context table freeze, family enumeration (m), lockbox-testable list, H1 events
estimand_secondary_not_run:
  - "A-L correlation of context effects vs matched random gene sets (seed 7100)"
estimand_secondary_not_run_reason: "PI rulings A4 (G1) and A5: under-specified (correlation statistic, number of sets, matching tolerances, pair set and summary are not registered); specifying it now would add analyst choices. Erratum (A5): the matched sets are drawn from frozen-complex members, so the comparison would not need L values of non-member genes. Reported as a limitation."
amendments:
  - id: A3
    timestamp_utc: 2026-10-29T02:03:27Z
    amends_commit: 21fe1be1cdfe9d9b5b68c02c1b5a46b2b5b66a69
    reason: >
      PI ruling A3(b) on the lockbox dry check, before any lockbox read; no L values read. The multiverse score
      within_line_rank needs genome-wide within-line ranks in L, but the registered BENCH read covers complex members
      only, so the entry is internally inconsistent; the PI chose not to widen the lockbox read and within_line_rank
      is declared NOT RUN (reported as a limitation). Record: docs/registry/AMENDMENTS.md.
    changed_paths: [multiverse.not_run, multiverse.not_run_reason]
  - id: A4
    timestamp_utc: 2026-10-29T02:42:37Z
    amends_commit: b349e98868ec8fb5d75b9f0f10e162ade9b6efe2
    reason: >
      PI rulings A4 (G1, G2) on results/part2/lockbox_confirm/GAPS.md, before any lockbox read; no L values read. G1:
      both BENCH secondary components (A-L correlation vs matched random sets; number of distinct complexes among the
      g*) are NOT RUN: under-specified, specifying them now would add analyst choices, and the random-set comparison
      needs L values of non-member genes, which would widen the registered member-only BENCH read (same reasoning as
      A3(b)); reported as limitations. G2: the multiverse reports point estimates only (registry silent; descriptive);
      the primary estimand keeps its registered CIs. Record: docs/registry/AMENDMENTS.md.
    changed_paths: [estimand_secondary_not_run, estimand_secondary_not_run_reason, multiverse.ci]
  - id: A5
    timestamp_utc: 2026-10-29T03:25:03Z
    amends_commit: b64109790478261569cdbc74d2eda6c31154cd4c
    reason: >
      PI rulings A5 on the pre-read code review, before any lockbox read; no L values read. Erratum to A4 G1's reason:
      the random-set comparison draws from frozen-complex members (calib.matched_random_sets), so it would not need L
      values of non-member genes; under-specification remains the reason the A-L random-set correlation is NOT RUN. A4
      is reversed for the number of distinct complexes among the g*, which is A-only and is reported. The BENCH
      multiverse stays point estimates only. Record: docs/registry/AMENDMENTS.md.
    changed_paths: [estimand_secondary_not_run, estimand_secondary_not_run_reason]
status: closed
