# H1S silencing-type within-complex genetic interactions: EXPLORATORY entry created by FZ-X amendment A1 from
# H1_within_complex_GI (docs/registry/AMENDMENTS.md). Never headlined.
id: H1S_silencing_GI
direction: H1S
hypothesis: >
  EXPLORATORY companion of H1 (amendment A1; never headlined; labelled exploratory wherever reported). Silencing-
  type loss of a gene g that is a member of, or attached to, a frozen coarse complex C rewires dependency on the
  rest of C: paralog compensation, residual sensitisation, collapse, or no change (neutral by TOST). Estimand,
  score, classes, covariates, TOST and matched-set rules are those of H1_within_complex_GI; the silencing-type
  events of the FZ-X event list form their own BH family.
sign: two-sided
