# H3b driver / genome-state family (DESIGN v3.1 2.6). Drafted at FZ-R; only `pending` fields may change before
# the first run (filled at FZ-C / FZ-X; part2.registry.fill_only_changes).
id: H3b_driver_family
direction: H3b
hypothesis: >
  Driver and genome-state contexts (hotspots, TP53 status, MSI-H, WGD, 9p21 loss, MYC/MYCN amplification, LoY,
  sex, NRF2 activity, tumour-suppressor LoF, registered fusions) are associated with complex-level dependency
  (S_C) of the frozen coarse complexes; every context is tested against every frozen coarse complex.
sign: two-sided
