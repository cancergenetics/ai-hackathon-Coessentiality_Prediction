  - results/part2/lockbox/manifest.json
  - FZ-C   # FZ-C manifest: complex map, sub-modules, tiers, member/attachment rules
  - FZ-X   # FZ-X manifest: context table freeze, family enumeration (m), lockbox-testable list, H1 events
pending:
