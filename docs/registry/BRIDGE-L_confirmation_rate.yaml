complex_set_hash: 14b6c53a01146a61
units: >
  Frozen coarse clusters of the GLS comparator map (built with the same pipeline on the same S and frozen at
  FZ-C with the zavg map). The zavg outcomes are taken from the closed H3a/H3b entries (no new zavg read).
score: S_C_mean_winsor3
covariates: [lineage_FE, library, ScreenType3DO, ModelType]
covariate_rule: >
  Per-context lists exactly as in H3a_lineage_atlas and H3b_driver_family.
statistic: >
  GLS-map discovery in A with the H3a and H3b machinery unchanged: two run_association calls (the 23 H3a
  contexts; the 20 H3b contexts), each with its own Benjamini-Bogomolov family at q = 0.05 and permutation
  re-entry. Then one lockbox read for members of GLS-map discoveries; confirmation as in H3a/H3b.
fdr_family:
  method: benjamini_bogomolov
  families: contexts
  q: 0.05
estimand: |
  Per map: confirmation rate = confirmed / discovered (lockbox-testable contexts only) within cluster-size bins
     {3-4, 5-8, 9-16, 17-60}, averaged with the bin weights of the pooled zavg + GLS discovered-cluster size
     distribution.
  Difference zavg - GLS with 95% CI by bootstrap over discovered hits within map and bin (B = 2000, seed 5200).
family_m:
  formula: "GLS map: m = sum over the 43 contexts of evaluable (context, GLS coarse cluster) tests (H3a and H3b budgets separate)"
  value:
    H3a: 8717
    H3b: 7577
    total: 16294
lockbox:
  target_list: results/part2/lockbox_targets/BRIDGE-L_confirmation_rate.json
  rule: >
    One read (crispr) of the members of GLS-map discovered clusters, only after every controls/H3a/H3b/H1/H2
    entry has a ledger line.
multiverse:
  other: [unweighted confirmation rate, matched gene coverage subset, T1/T2 clusters only]
  use: "reported, never selected"
  ci: bootstrap as primary
seeds:
  permutation: 4500
  bootstrap: 5200
  lockbox_permutation: 6600
run_after: [every controls/H3a/H3b/H1/H2 entry closed with its lockbox ledger line]
success_criterion: >
  Secondary endpoint: 'supports the bridge' if the size-standardised difference zavg - GLS > 0 with its 95% CI
  excluding 0; otherwise reported without a claim. It never overrides the primary bridge endpoint.
stopping_rule: >
  One GLS-map discovery pass (two calls), one permutation pass, one lockbox read, then closed.
frozen_inputs:
  - results/part2/contexts/checksums.json
  - results/part2/lockbox/manifest.json
  - results/part2/construction/FZC_manifest.json   # FZ-C manifest: complex map, sub-modules, tiers, member/attachment rules
  - results/part2/fzx/FZX_manifest.json   # FZ-X manifest: context table freeze, family enumeration (m), lockbox-testable list, H1 events
