# H2 sub-module divergence (DESIGN v3.1 2.6). Drafted at FZ-R; only `pending` fields may change before the
# first run (part2.registry.fill_only_changes). Runs after the H3a and H3b discovery runs are committed.
id: H2_submodule_divergence
direction: H2
hypothesis: >
  Within complexes whose dependency is associated with a lineage or driver context (H3a/H3b discoveries),
  sub-modules diverge from the rest of their complex: the sub-module score, residualised on its sibling
  complement (parent minus sub-module), is associated with the same context. Headline (Fig 5).
