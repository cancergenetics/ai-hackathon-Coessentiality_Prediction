complex_set_hash: 141a70b7133ed8a4
units: >
  Frozen sub-modules (FZ-C: top-down re-clustering at gamma = 0.5 inside each coarse cluster, size 3-60,
  cohesion mean score >= z0 + 1) of frozen coarse complexes that have >= 2 sub-modules. Hash over all such
  sub-module IDs; only the stage-wise eligible subset is tested.
score: submodule_vs_sibling
score_rule: >
  For sub-module s of parent P: S_s and S_sib = mean member effect (clipped to [-3, 3]) of s and of the sibling
  complement P minus s (members of P not in s, incl. members in no sub-module), after the context's removals
  applied to both. Y_s = S_s - (a_s + b_s S_sib), with (a_s, b_s) fitted by OLS across all A models
  (complete-case); the same A-fitted (a_s, b_s) are applied unchanged to L models for confirmation.
covariates: [lineage_FE, library, ScreenType3DO, ModelType, NNMD, CasActivity]
covariate_rule: >
  Each context's H3a/H3b covariate list plus NNMD (ScreenNNMD) and CasActivity as primary covariates (round-2
  biology item 7: part-whole scale confounding). CasActivity is missing in 119 of 1,007 A models; complete-case
  per test, sensitivity without CasActivity reported.
statistic: >
  HC3 OLS t of the context coefficient with Satterthwaite df, two-sided, complete-case per test (n reported). A
  (context, unit) test is evaluable if >= 12 context and >= 12 reference A models remain after complete-case and
  >= 2 members remain after removals; non-evaluable tests are listed and excluded from m. Screening hits
  (stage-wise-adjusted q < 0.1) are re-tested by exact PatientID-blocked Freedman-Lane permutation (10,000
  permutations; GPD tail when p_perm < 1e-4), within-lineage for non-lineage contexts and unrestricted across
  lineages for lineage contexts; permutation p-values re-enter and the stage-wise procedure is re-run (DESIGN
  2.5).
fdr_family:
  method: stagewise_bb
  parent_directions: [H3a, H3b]
  q: 0.05
fdr_rule: >
  Stage-wise inside complexes that pass (DESIGN 2.5): for context c, only sub-modules of parents P that were
  discovered for c in the parent direction (H3a for lineage contexts, H3b for driver contexts; discovery in A
  after permutation re-entry; lockbox not required) and that have >= 2 sub-modules are tested. Each such (c, P)
  is a family; within it, BH over P's sub-modules at q R_x / m_x, where m_x and R_x are the number of tests and
  of rejections of the parent direction x (Benjamini-Bogomolov with the parent rejections as the selection
  step). Discovery = rejection after permutation re-entry. run_association has no stagewise_bb implementation
  yet and refuses this method until one is added and tested.
family_m:
  formula: "m_H2 = sum over (context c, parent P) discovered in H3a or H3b with >= 2 sub-modules of the number of evaluable sub-modules of P; level per family q R_x / m_x"
  value: "set by the committed H3a and H3b discovery runs (formula fixed here)"
kill_rule:
  controls: [PC21, PC22]
  rule: >
    Kill rule (DESIGN 2.6), from the controls run: the direction is dropped if < 50% of its evaluable
    complex-level controls are recovered. The run and the lockbox read still happen (to report the null and keep
    the lockbox read order), but a killed direction is labelled 'killed by controls' and contributes no claims.
    With 0 evaluable controls the rule is n/a and the direction is labelled exploratory; with 1-2 evaluable
    controls the rule applies as written and the paper states the thin control coverage.
lockbox:
  confirmation_rule: >
    Discovered hit confirmed iff same sign and one-sided p < 0.05 in L (HC3, Satterthwaite df, same residualised
    score with A-fitted coefficients, removals and covariates; exact PatientID-blocked Freedman-Lane
    permutation, within-lineage for non-lineage contexts, when fewer than 20 context models are in L), for
    contexts with >= 5 context and >= 5 reference models in L. Other contexts take the rare-context route:
    leave-one-lineage-out (LOSO) same sign, DEMETER2 on A models same sign and leave-one-model-out same sign,
    labelled 'not lockbox-testable'. L effects with 95% CIs are reported for every discovered hit, confirmed or
    not (winner's-curse guard).
  target_list: results/part2/lockbox_targets/H2_submodule_divergence.json
multiverse:
  scores: [raw difference S_s - S_sib, eigengene, within_line_rank, pan_essential_referenced]
  covariate_sensitivity: [without CasActivity (full n), doubling_time, GrowthPattern]
  robustness: [LOSO same sign p < 0.05, leave-top-2-out same sign p < 0.05, breadth within s]
  use: "reported per hit, never selected"
calibration:
  negative_controls: >
    Random member splits of the same parents (size of s preserved, seed 4800) residualised the same way, and the
    H3 pseudo-contexts, run through the same stage-wise machinery; reported.
  seed: 4800
seeds:
  permutation: 4300
  random_splits: 4800
run_after: [H3a_lineage_atlas discovery run committed, H3b_driver_family discovery run committed]
success_criterion: >
  Strongest-finding rule (DESIGN 2.5): stage-wise discovery AND lockbox-confirmed (or the labelled rare-context
  route) AND LOSO-robust (same sign, p < 0.05) AND not a locus cluster; ranked by the A statistic x tier.
  Direction: H2 is supported if >= 1 such hit exists and the kill rule (PC21, PC22) does not fire.
stopping_rule: >
  One discovery run in A after the H3a and H3b discovery runs are committed; one permutation pass; one lockbox
  read (crispr) for the members of discovered sub-modules and their parents; then closed. If no (context,
  parent) pair is eligible, H2 is reported as 'not testable' (m = 0) and closed with a zero-target ledger line;
  no unrestricted sub-module screen is run.
frozen_inputs:
  - results/part2/contexts/checksums.json
