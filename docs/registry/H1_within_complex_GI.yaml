# H1 within-complex genetic interactions (DESIGN v3.1 2.6). Drafted at FZ-R; amended A1 (LoF / hom-del events only;
# silencing events in H1S_silencing_GI). The event list is enumerated at
# FZ-X by the rule below; only `pending` fields may change before the first run (part2.registry.fill_only_changes).
id: H1_within_complex_GI
direction: H1
hypothesis: >
  Loss of a gene g that is a member of, or attached to, a frozen coarse complex C rewires dependency on the rest
  of C: paralog compensation (in-complex paralogs of g become more essential), residual sensitisation
  (non-paralog members' dependency grows in its baseline direction), collapse (non-paralog members' dependency
  shrinks toward 0), or no change (neutral by TOST). Estimand: beta = effect of loss(g) on S_{C minus g}, with
  member-resolved profiles. Headline mechanistic panel (Fig 4).
sign: two-sided
