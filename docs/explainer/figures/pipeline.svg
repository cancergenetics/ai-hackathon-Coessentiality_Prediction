<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" width="920" height="590" role="img" aria-labelledby="pl-title pl-desc" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <title id="pl-title">Part 2 pipeline: from a locked pair score to confirmed complex-level dependencies</title>
  <desc id="pl-desc">Inputs (DepMap CRISPR gene effects and the locked zavg_BEF pair score, validated once on hu.MAP test pairs) feed six steps: split lines into construction set A and lockbox L; build the complex map; define contexts and score complexes; test complex by context associations on A; calibrate against reference gene sets; confirm once on L and apply the strongest-findings rule. Output: 254 strongest findings.</desc>
  <defs>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--pl-line, #6b707a)"/>
    </marker>
  </defs>
  <style>
    .pl-box { fill: var(--pl-step, #e8f0fb); stroke: var(--pl-stroke, #b8bcc5); stroke-width: 1.2; }
    .pl-in-box { fill: var(--pl-in, #eceef2); stroke: var(--pl-stroke, #b8bcc5); stroke-width: 1.2; }
    .pl-out-box { fill: var(--pl-out, #2a78d6); }
    .pl-t { font-size: 16px; font-weight: 700; fill: var(--pl-ink, #14161a); }
    .pl-d { font-size: 13.5px; fill: var(--pl-muted, #5a5f69); }
    .pl-n { font-size: 13px; font-weight: 700; fill: var(--pl-accent-ink, #1c5cab); }
    .pl-ot { font-size: 16px; font-weight: 700; fill: var(--pl-out-ink, #ffffff); }
    .pl-od { font-size: 13.5px; fill: var(--pl-out-ink, #ffffff); }
    .pl-line { stroke: var(--pl-line, #6b707a); stroke-width: 1.6; fill: none; }
    .pl-node { cursor: pointer; }
    .pl-node:hover .pl-box, .pl-node:hover .pl-in-box, .pl-node:focus .pl-box, .pl-node:focus .pl-in-box { stroke: var(--pl-accent, #2a78d6); stroke-width: 2.4; }
  </style>

  <!-- inputs -->
  <g class="pl-node" id="pipe-input" data-step="step0" tabindex="0">
    <rect class="pl-in-box" x="20" y="16" width="420" height="92" rx="10"/>
    <text class="pl-t" x="38" y="44">DepMap CRISPR gene effects</text>
    <text class="pl-d" x="38" y="68">Chronos scores, 1,345 non-engineered cell lines</text>
    <text class="pl-d" x="38" y="90">plus omics and model labels (contexts only)</text>
  </g>
  <g class="pl-node" id="pipe-step0" data-step="step0" tabindex="0">
    <rect class="pl-in-box" x="480" y="16" width="420" height="92" rx="10"/>
    <text class="pl-n" x="498" y="40">0 · THE INPUT</text>
    <text class="pl-t" x="498" y="62">Locked pair score zavg_BEF (Part 1)</text>
    <text class="pl-d" x="498" y="86">held-out test: AP 0.333 vs GLS 0.212</text>
  </g>
  <path class="pl-line" d="M230,108 V130 H460 V146" marker-end="url(#pl-arrow)"/>
  <path class="pl-line" d="M690,108 V130 H460" />

  <!-- row 1: steps 1-3 -->
  <g class="pl-node" id="pipe-step1" data-step="step1" tabindex="0">
    <rect class="pl-box" x="20" y="150" width="280" height="118" rx="10"/>
    <text class="pl-n" x="38" y="176">STEP 1</text>
    <text class="pl-t" x="38" y="199">Split the cell lines</text>
    <text class="pl-d" x="38" y="223">build set A 1,007 · lockbox L 338</text>
    <text class="pl-d" x="38" y="245">patient-blocked, stratified</text>
  </g>
  <g class="pl-node" id="pipe-step2" data-step="step2" tabindex="0">
    <rect class="pl-box" x="320" y="150" width="280" height="118" rx="10"/>
    <text class="pl-n" x="338" y="176">STEP 2</text>
    <text class="pl-t" x="338" y="199">Build the complex map (A)</text>
    <text class="pl-d" x="338" y="223">edges: score ≥ 6, mutual top-10</text>
    <text class="pl-d" x="338" y="245">consensus Leiden → 367 complexes</text>
  </g>
  <g class="pl-node" id="pipe-step3" data-step="step3" tabindex="0">
    <rect class="pl-box" x="620" y="150" width="280" height="118" rx="10"/>
    <text class="pl-n" x="638" y="176">STEP 3</text>
    <text class="pl-t" x="638" y="199">Contexts and complex scores</text>
    <text class="pl-d" x="638" y="223">lineage, driver, genome state</text>
    <text class="pl-d" x="638" y="245">score = mean member effect</text>
  </g>
  <path class="pl-line" d="M300,209 H316" marker-end="url(#pl-arrow)"/>
  <path class="pl-line" d="M600,209 H616" marker-end="url(#pl-arrow)"/>
  <path class="pl-line" d="M760,268 V292 H160 V312" marker-end="url(#pl-arrow)"/>

  <!-- row 2: steps 4-6 -->
  <g class="pl-node" id="pipe-step4" data-step="step4" tabindex="0">
    <rect class="pl-box" x="20" y="316" width="280" height="118" rx="10"/>
    <text class="pl-n" x="38" y="342">STEP 4</text>
    <text class="pl-t" x="38" y="365">Test complex × context (A)</text>
    <text class="pl-d" x="38" y="389">HC3 regression, permutation</text>
    <text class="pl-d" x="38" y="411">selective FDR → 1,145 + 161 hits</text>
  </g>
  <g class="pl-node" id="pipe-step5" data-step="step5" tabindex="0">
    <rect class="pl-box" x="320" y="316" width="280" height="118" rx="10"/>
    <text class="pl-n" x="338" y="342">STEP 5</text>
    <text class="pl-t" x="338" y="365">Calibrate against nulls (A)</text>
    <text class="pl-d" x="338" y="389">matched gene sets, never-</text>
    <text class="pl-d" x="338" y="411">expressed sets, pseudo-contexts</text>
  </g>
  <g class="pl-node" id="pipe-step6" data-step="step6" tabindex="0">
    <rect class="pl-box" x="620" y="316" width="280" height="118" rx="10"/>
    <text class="pl-n" x="638" y="342">STEP 6</text>
    <text class="pl-t" x="638" y="365">Confirm once on lockbox L</text>
    <text class="pl-d" x="638" y="389">same sign, one-sided p &lt; 0.05</text>
    <text class="pl-d" x="638" y="411">+ registered strongest rule</text>
  </g>
  <path class="pl-line" d="M300,375 H316" marker-end="url(#pl-arrow)"/>
  <path class="pl-line" d="M600,375 H616" marker-end="url(#pl-arrow)"/>
  <!-- lockbox L travels untouched from step 1 to step 6 -->
  <path class="pl-line" d="M20,250 H8 V454 H860 V438" style="stroke-dasharray: 5 4" marker-end="url(#pl-arrow)"/>
  <text class="pl-d" x="330" y="445" style="font-size: 12.5px">lockbox L: sealed from step 1 until step 6 (one read)</text>
  <path class="pl-line" d="M700,434 V470" marker-end="url(#pl-arrow)"/>

  <!-- output -->
  <g id="pipe-output">
    <rect class="pl-out-box" x="320" y="474" width="580" height="104" rx="10"/>
    <text class="pl-ot" x="340" y="504">Output</text>
    <text class="pl-od" x="340" y="530">Complex-level dependencies tied to cancer contexts,</text>
    <text class="pl-od" x="340" y="552">replicated in held-out lines (6 via a rare-context route): 254 strongest findings</text>
  </g>
  <text class="pl-d" x="20" y="500" style="font-size: 12.5px">A = construction set (all fitting, choosing,</text>
  <text class="pl-d" x="20" y="520" style="font-size: 12.5px">testing). L = lockbox, read once per</text>
  <text class="pl-d" x="20" y="540" style="font-size: 12.5px">registered analysis, through a ledger.</text>
</svg>
